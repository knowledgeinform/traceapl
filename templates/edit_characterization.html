{% extends "base.html" %}
{% block content %}
<section class="page-title">
  <h1>Edit Characterization</h1>
  <p>Admin-only editing for {{ sample.sample_id }}.</p>
</section>

<section class="card narrow">
  <form method="post" class="form">
    <label>Characterization Type <span class="required">required</span><input name="characterization_type" value="{{ characterization.characterization_type }}" required></label>
    <label>Assigned To<input name="assigned_to" data-employee-autocomplete value="{{ characterization.assigned_to or '' }}" autocomplete="off"></label>
    <label>Notes<textarea name="notes" rows="4">{{ characterization.notes or '' }}</textarea></label>
    <label>Data Location<input name="data_location" data-denodo-autocomplete="location" value="{{ characterization.data_location or '' }}" autocomplete="off"></label>

    <label>Completion Status
      <select name="completion_status">
        <option value="pending" {% if not characterization.completed_at %}selected{% endif %}>Pending</option>
        <option value="complete" {% if characterization.completed_at %}selected{% endif %}>Complete</option>
      </select>
    </label>
    <label>Completed By<input name="completed_by" data-employee-autocomplete value="{{ characterization.completed_by or '' }}" autocomplete="off"></label>
    <label>Completed At<input name="completed_at" value="{{ characterization.completed_at or '' }}" placeholder="YYYY-MM-DD HH:MM:SS"></label>

    <label class="checkbox-row">
      <input type="checkbox" name="send_assignment_email" value="1">
      Send assignment email if assignee changed
    </label>

    <div class="actions compact">
      <button class="button primary" type="submit">Save Changes</button>
      <a class="button" href="{{ url_for('sample_detail', qr_code_value=sample.qr_code_value) }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
