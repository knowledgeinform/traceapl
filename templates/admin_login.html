{% extends "base.html" %}
{% block content %}
<section class="card login-card">
  <h1>TraceAPL Admin Login</h1>
  <p class="muted">Administrative tools are password protected. Use this page to access database backup controls and sample removal features.</p>
  <form method="post" class="form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>
      Admin password
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="button primary" type="submit">Log In</button>
  </form>
</section>
{% endblock %}
