<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">TraceAPL QR locator mark</title>
  <desc id="desc">A QR code inside a locator bullseye with digital trace pixels.</desc>
  <defs>
    <linearGradient id="blue" x1="20" y1="140" x2="140" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e5bd7"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="160" height="160" rx="36" fill="#03132b"/>
  <circle cx="72" cy="76" r="58" fill="none" stroke="#0a84ff" stroke-width="4" opacity=".38"/>
  <path d="M20 76h18M106 76h18M72 24v18M72 110v18" fill="none" stroke="#e8f2ff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <path d="M38 30a62 62 0 0 1 68 0M32 118a68 68 0 0 0 82 4" fill="none" stroke="url(#blue)" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <g fill="#e8f2ff">
    <rect x="46" y="50" width="20" height="20" rx="3"/><rect x="78" y="50" width="20" height="20" rx="3"/><rect x="46" y="82" width="20" height="20" rx="3"/>
  </g>
  <g fill="#03132b">
    <rect x="52" y="56" width="8" height="8" rx="1"/><rect x="84" y="56" width="8" height="8" rx="1"/><rect x="52" y="88" width="8" height="8" rx="1"/>
  </g>
  <g fill="#a9d4ff">
    <rect x="72" y="78" width="8" height="8"/><rect x="86" y="78" width="8" height="8"/><rect x="74" y="92" width="8" height="8"/><rect x="94" y="94" width="8" height="8"/><rect x="104" y="82" width="6" height="6"/><rect x="104" y="100" width="5" height="5"/>
    <rect x="116" y="54" width="5" height="5" opacity=".8"/><rect x="126" y="70" width="4" height="4" opacity=".6"/><rect x="119" y="92" width="6" height="6" opacity=".75"/><rect x="132" y="108" width="4" height="4" opacity=".5"/>
  </g>
  <circle cx="72" cy="76" r="6" fill="url(#blue)" filter="url(#glow)" opacity=".85"/>
</svg>
